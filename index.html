
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator & Remittance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:14px}
.container{max-width:520px;margin:auto}
h2{text-align:center;margin:8px 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:#263449;color:#fff;font-size:16px}
.tabs button.active{background:#1685e8}
.panel{background:#192538;padding:14px;border-radius:14px;margin-bottom:14px}
.hidden{display:none}
label{display:block;font-size:14px;color:#cbd5e1;margin:12px 0 6px}
input,select{background:#0e1929;color:#fff;border:1px solid #40516a;border-radius:9px;padding:12px;font-size:17px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid #1685e8}
.currency-box{display:flex;background:#0e1929;border:1px solid #40516a;border-radius:10px;overflow:hidden}
.currency-box select{width:42%;border:0;border-right:1px solid #40516a;border-radius:0;font-size:15px}
.currency-box input{flex:1;border:0;border-radius:0;text-align:right}
button{cursor:pointer}
.action{width:100%;padding:13px;border:0;border-radius:9px;background:#1685e8;color:white;font-size:16px;margin-top:12px}
.clear{background:#c0392b}
.result{padding:11px 0;border-bottom:1px solid #34445b;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.result strong{text-align:right;color:#58d68d;overflow-wrap:anywhere}
.result:last-child{border:0}
.calc-display{width:100%;height:65px;text-align:right;font-size:27px;margin-bottom:12px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:17px 5px;border:0;border-radius:9px;background:#2a3b53;color:#fff;font-size:20px}
.calc-grid button.op{background:#1769aa}
.calc-grid button.equal{background:#159957}
.calc-grid button.clearbtn{background:#a93226}
.small{font-size:12px;color:#9eafc4;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2 id="heading">ক্যালকুলেটর</h2>

<div class="tabs">
<button id="calcTab" class="active" onclick="showTab('calc')">Calculator</button>
<button id="remitTab" onclick="showTab('remit')">Remittance</button>
</div>

<div id="calcPanel" class="panel">
<label>Calculation Mode</label>
<select id="calcMode">
<option value="regular">Regular (BODMAS)</option>
<option value="sequential">Sequential</option>
</select>
<input id="calcDisplay" class="calc-display" value="0" readonly>
<div class="calc-grid">
<button class="clearbtn" onclick="calcClear()">AC</button>
<button onclick="calcDelete()">DEL</button>
<button onclick="calcAdd('%')">%</button>
<button class="op" onclick="calcAdd('/')">÷</button>

<button onclick="calcAdd('7')">7</button>
<button onclick="calcAdd('8')">8</button>
<button onclick="calcAdd('9')">9</button>
<button class="op" onclick="calcAdd('*')">×</button>

<button onclick="calcAdd('4')">4</button>
<button onclick="calcAdd('5')">5</button>
<button onclick="calcAdd('6')">6</button>
<button class="op" onclick="calcAdd('-')">−</button>

<button onclick="calcAdd('1')">1</button>
<button onclick="calcAdd('2')">2</button>
<button onclick="calcAdd('3')">3</button>
<button class="op" onclick="calcAdd('+')">+</button>

<button onclick="calcAdd('(')">(</button>
<button onclick="calcAdd('0')">0</button>
<button onclick="calcAdd('.')">.</button>
<button onclick="calcAdd(')')">)</button>

<button onclick="calcCopy()">Copy</button>
<button class="clearbtn" onclick="calcClear()">Clear</button>
<button class="equal" style="grid-column:span 2" onclick="calculate()">=</button>
</div>
</div>

<div id="remitPanel" class="hidden">
<div class="panel">
<label>From Currency & Amount</label>
<div class="currency-box">
<select id="fromCurrency"></select>
<input id="fromAmount" type="number" inputmode="decimal" value="0">
</div>

<label>To Currency & Amount</label>
<div class="currency-box">
<select id="toCurrency"></select>
<input id="toAmount" type="number" inputmode="decimal" value="0">
</div>
</div>

<div class="panel">
<label>Actual Currency Rate</label>
<input id="actualRate" type="number" inputmode="decimal" value="0">

<label>Manual Rate (0 হলে Actual Rate ব্যবহার হবে)</label>
<input id="manualRate" type="number" inputmode="decimal" value="0">

<label>প্রণোদনা (%)</label>
<input id="incentive" type="number" inputmode="decimal" value="0">

<label>Charge</label>
<input id="charge" type="number" inputmode="decimal" value="0">

<button class="action clear" onclick="clearAll()">Clear All</button>
</div>

<div class="panel">
<div class="result">
<span>Total Convert Amount with Charge</span>
<strong id="totalWithCharge">0</strong>
</div>

<label>Total Converted Amount with Incentive (Editable)</label>
<input id="convertedWithIncentive" type="number" inputmode="decimal" value="0">

<div class="result">
<span>Incentive Amount</span>
<strong id="incentiveAmount">0</strong>
</div>
<div class="result">
<span>Charge</span>
<strong id="chargeResult">0</strong>
</div>
<div class="result">
<span>Rate Difference Benefit with Incentive Amount</span>
<strong id="rateDifferenceBenefit">0</strong>
</div>
<div class="result">
<span>Total Benefit</span>
<strong id="totalBenefit">0</strong>
</div>
</div>
</div>
</div>

<script>
const currencies=[
'BDT','QAR','USD','SAR','AED','INR','GBP','EUR','KWD','OMR','BHD','PKR'
];

const fromSelect=document.getElementById('fromCurrency');
const toSelect=document.getElementById('toCurrency');

currencies.forEach(c=>{
 fromSelect.add(new Option(c,c));
 toSelect.add(new Option(c,c));
});

fromSelect.value='QAR';
toSelect.value='BDT';

function showTab(tab){
 document.getElementById('calcPanel').classList.toggle('hidden',tab!=='calc');
 document.getElementById('remitPanel').classList.toggle('hidden',tab!=='remit');
 document.getElementById('calcTab').classList.toggle('active',tab==='calc');
 document.getElementById('remitTab').classList.toggle('active',tab==='remit');
 document.getElementById('heading').textContent=tab==='calc'?'ক্যালকুলেটর':'Remittance Calculator';
}

/* Calculator */
let expression='';
const display=document.getElementById('calcDisplay');

function calcAdd(value){
 if(display.value==='Error')expression='';
 if(display.value==='0' && /^[0-9]$/.test(value))expression='';
 expression+=value;
 display.value=expression||'0';
}
function calcClear(){expression='';display.value='0'}
function calcDelete(){
 expression=expression.slice(0,-1);
 display.value=expression||'0';
}
function calculate(){
 try{
  if(!expression)return;
  let result;
  if(document.getElementById('calcMode').value==='sequential'){
   result=sequentialCalculate(expression);
  }else{
   if(!/^[0-9+\-*/().% ]+$/.test(expression))throw Error();
   result=Function('"use strict";return ('+expression.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)')+')')();
  }
  if(!Number.isFinite(result))throw Error();
  display.value=Number(result.toFixed(8)).toString();
  expression=display.value;
 }catch(e){
  display.value='Error';
  expression='';
 }
}
function sequentialCalculate(exp){
 if(!/^[0-9+\-*/().% ]+$/.test(exp))throw Error();
 const tokens=exp.match(/\d+(?:\.\d+)?%?|[()+\-*/]/g);
 if(!tokens||tokens.join('')!==exp.replace(/\s/g,''))throw Error();
 let i=0;
 function atom(){
  let t=tokens[i++];
  if(t==='('){
   let v=calcExpr();
   if(tokens[i++]!==')')throw Error();
   return v;
  }
  if(t==='-')return -atom();
  if(t==='+')return atom();
  if(!t||!/^(\d+\.?\d*|\.\d+)%?$/.test(t))throw Error();
  return t.endsWith('%')?parseFloat(t)/100:parseFloat(t);
 }
 function calcExpr(){
  let v=atom();
  while(i<tokens.length&&tokens[i]!==')'){
   let op=tokens[i++];
   let b=atom();
   if(op==='+')v+=b;
   else if(op==='-')v-=b;
   else if(op==='*')v*=b;
   else if(op==='/')v/=b;
   else throw Error();
  }
  return v;
 }
 let r=calcExpr();
 if(i!==tokens.length)throw Error();
 return r;
}
function calcCopy(){
 if(display.value&&display.value!=='Error')navigator.clipboard?.writeText(display.value);
}

/* Remittance */
const el=id=>document.getElementById(id);
const num=id=>Math.max(0,Number(el(id).value)||0);
const fmt=n=>Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:4}):'0';

let editing='';

function updateRemit(source){
 const from=num('fromAmount');
 const actual=num('actualRate');
 const manual=num('manualRate');
 const incentive=num('incentive');
 const charge=num('charge');
 const usedRate=manual>0?manual:actual;
 const factor=1+incentive/100;

 if(source==='from'){
  el('toAmount').value=fmt(from*actual);
  el('convertedWithIncentive').value=fmt(from*usedRate*factor);
 }else if(source==='to'){
  el('fromAmount').value=actual>0?fmt(num('toAmount')/actual):'0';
  el('convertedWithIncentive').value=fmt(num('fromAmount')*usedRate*factor);
 }else if(source==='converted'){
  const converted=num('convertedWithIncentive');
  const divisor=actual*factor;
  if(divisor>0){
   el('fromAmount').value=fmt(converted/divisor);
   el('toAmount').value=fmt(converted);
  }
 }else{
  el('toAmount').value=fmt(from*actual);
  el('convertedWithIncentive').value=fmt(from*usedRate*factor);
 }

 const base=from*usedRate;
 const incentiveValue=base*incentive/100;
 const rateDifference=manual>0?from*(manual-actual):0;
 const benefit=incentiveValue+rateDifference;

 el('totalWithCharge').textContent=fmt(from+charge)+' '+fromSelect.value;
 el('incentiveAmount').textContent=fmt(incentiveValue)+' '+toSelect.value;
 el('chargeResult').textContent=fmt(charge)+' '+fromSelect.value;
 el('rateDifferenceBenefit').textContent=fmt(benefit)+' '+toSelect.value;
 el('totalBenefit').textContent=fmt(benefit)+' '+toSelect.value;
}

el('fromAmount').addEventListener('input',()=>updateRemit('from'));
el('toAmount').addEventListener('input',()=>updateRemit('to'));
el('convertedWithIncentive').addEventListener('input',()=>updateRemit('converted'));

['actualRate','manualRate','incentive','charge'].forEach(id=>{
 el(id).addEventListener('input',()=>updateRemit('settings'));
});

fromSelect.addEventListener('change',()=>updateRemit('settings'));
toSelect.addEventListener('change',()=>updateRemit('settings'));

/* প্রথমে 0 থাকবে; টাইপ শুরু করলে 0 নিজে সরে যাবে */
document.querySelectorAll('input[type="number"]').forEach(input=>{
 input.addEventListener('focus',()=>{
  if(input.value==='0')input.value='';
 });
 input.addEventListener('blur',()=>{
  if(input.value==='')input.value='0';
  if(input.id==='fromAmount'||input.id==='toAmount'||input.id==='convertedWithIncentive'){
   updateRemit(input.id==='fromAmount'?'from':input.id==='toAmount'?'to':'converted');
  }else{
   updateRemit('settings');
  }
 });
});

function clearAll(){
 ['fromAmount','toAmount','actualRate','manualRate','incentive','charge','convertedWithIncentive'].forEach(id=>{
  el(id).value='0';
 });
 fromSelect.value='QAR';
 toSelect.value='BDT';
 updateRemit('settings');
}

updateRemit('settings');
</script>
</body>
</html>
