
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator & Remittance</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:560px;margin:auto}
h2{text-align:center;margin:8px 0 18px}
.top{display:flex;gap:7px;margin-bottom:14px;align-items:center}
.top button{flex:1}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:12px;background:#2a3b53;color:#fff}
.active{background:#1685e8}
.panel{background:#192538;padding:14px;border-radius:14px;margin-bottom:14px}
.hidden{display:none!important}
label{display:block;color:#cbd5e1;font-size:14px;margin:12px 0 6px}
input,select{width:100%;min-width:0;padding:12px;background:#0e1929;color:#fff;border:1px solid #40516a;border-radius:9px;font-size:16px}
input:focus,select:focus{outline:2px solid #1685e8}
.currency{display:flex;border:1px solid #40516a;border-radius:10px;overflow:hidden;background:#0e1929}
.currency select{width:38%;border:0;border-right:1px solid #40516a;border-radius:0;font-size:15px}
.currency input{flex:1;width:62%;border:0;border-radius:0;text-align:right}

/* White calculator board */
#calcPanel{
 background:#fff;
 color:#111;
 padding:14px;
 border:1px solid #ddd;
 box-shadow:0 3px 14px #0002;
}
#calcPanel label{color:#333}
#calcPanel select{
 background:#fff;color:#111;border:1px solid #bbb;
}
.calc-display{
 width:100%;
 height:144px;
 overflow:auto;
 overflow-wrap:anywhere;
 word-break:break-word;
 white-space:pre-wrap;
 text-align:right;
 font-size:32px;
 line-height:1.4;
 margin:8px 0 5px;
 padding:14px 12px;
 background:#fff;
 color:#111;
 border:1px solid #bbb;
 border-radius:12px;
 outline:none;
 user-select:text;
 -webkit-user-select:text;
 -webkit-touch-callout:default;
}
.live-result{
 min-height:42px;
 padding:5px 12px 12px;
 text-align:right;
 font-size:27px;
 font-weight:bold;
 color:#16834a;
 overflow-wrap:anywhere;
}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.grid button{
 font-size:23px;
 min-height:59px;
 padding:10px 3px;
 background:#fff;
 color:#111;
 border:1px solid #d5d5d5;
 border-radius:12px;
 box-shadow:0 2px 3px #0001;
}
.grid button:active{background:#e9e9e9;transform:scale(.97)}
.grid .op{background:#f2f2f2;color:#111;font-weight:bold}
.grid .eq{background:#e5e5e5;color:#111;font-weight:bold}
.grid .cross{background:#f2f2f2}
.grid .ac{background:#f2f2f2;color:#111;font-weight:bold}
.cross svg{width:30px;height:30px;display:block;margin:auto;fill:none;stroke:#111;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}

.result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #34445b;font-size:14px}
.result span{flex:1}
.result strong{text-align:right;color:#58d68d;overflow-wrap:anywhere}
.result-input{display:flex;gap:7px;align-items:stretch}
.result-input input{flex:1;text-align:right}
.result-input select{width:90px}
.action{width:100%;margin-top:14px;background:#1685e8}
.clear{background:#c0392b}
.small{color:#9eafc4;font-size:12px;margin-top:10px;line-height:1.5}

/* Compact remittance settings */
.settings-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:8px 10px;
}
.setting label{font-size:12px;margin:2px 0 5px}
.setting input{padding:10px 8px;font-size:15px;height:42px}
.settings-grid .action{grid-column:span 2;margin-top:3px;padding:10px}

@media(max-width:380px){
 body{padding:8px}
 .panel{padding:11px}
 #calcPanel{padding:10px}
 .grid{gap:6px}
 .grid button{min-height:53px;font-size:20px}
 .calc-display{height:144px;font-size:29px}
 .setting label{font-size:11px}
 .setting input{font-size:14px;padding:8px 6px}
}
</style>
</head>
<body>
<div class="container">
<h2 id="heading">ক্যালকুলেটর</h2>

<div class="top">
<button id="calcTab" class="active" onclick="showTab('calc')">Calculator</button>
<button id="remitTab" onclick="showTab('remit')">Remittance</button>
<select id="language" style="width:105px" onchange="setLanguage(this.value)">
<option value="bn">বাংলা</option>
<option value="en">English</option>
</select>
</div>

<!-- CALCULATOR -->
<div id="calcPanel" class="panel">
<label id="modeLabel">হিসাবের নিয়ম</label>
<select id="calcMode">
<option value="regular">Regular (BODMAS)</option>
<option value="sequential">Sequential</option>
</select>

<label id="expressionLabel">আপনার হিসাব লিখুন</label>
<div id="calcDisplay" class="calc-display"
 contenteditable="true" inputmode="none"
 spellcheck="false" role="textbox">0</div>

<div id="liveResult" class="live-result"> </div>

<div class="grid">
<button class="ac" onclick="calcClear()">AC</button>
<button class="cross" onclick="calcDelete()" aria-label="Delete">
<svg viewBox="0 0 32 32">
<path d="M11 5H27V27H11L3 16Z"/>
<path d="M16 12L23 20M23 12L16 20"/>
</svg>
</button>
<button class="op" onclick="calcAdd('%')">%</button>
<button class="op" onclick="calcAdd('/')">÷</button>

<button onclick="calcAdd('1')">1</button>
<button onclick="calcAdd('2')">2</button>
<button onclick="calcAdd('3')">3</button>
<button class="op" onclick="calcAdd('*')">×</button>

<button onclick="calcAdd('4')">4</button>
<button onclick="calcAdd('5')">5</button>
<button onclick="calcAdd('6')">6</button>
<button class="op" onclick="calcAdd('-')">−</button>

<button onclick="calcAdd('7')">7</button>
<button onclick="calcAdd('8')">8</button>
<button onclick="calcAdd('9')">9</button>
<button class="op" onclick="calcAdd('+')">+</button>

<button onclick="calcAdd('00')">00</button>
<button onclick="calcAdd('0')">0</button>
<button onclick="calcAdd('000')">000</button>
<button class="op" onclick="calcAdd('.')">.</button>

<button onclick="calcAdd('(')">(</button>
<button onclick="calcAdd(')')">)</button>
<button class="eq" style="grid-column:span 2" onclick="calculate()">=</button>
</div>
</div>

<!-- REMITTANCE -->
<div id="remitPanel" class="hidden">
<div class="panel">
<label id="fromLabel">From Currency & Amount</label>
<div class="currency">
<select id="fromCurrency"></select>
<input id="fromAmount" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>

<label id="toLabel">To Currency & Amount</label>
<div class="currency">
<select id="toCurrency"></select>
<input id="toAmount" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>
</div>

<div class="panel">
<div class="settings-grid">
<div class="setting">
<label id="actualLabel">Actual Currency Rate</label>
<input id="actualRate" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>
<div class="setting">
<label id="manualLabel">Manual Rate</label>
<input id="manualRate" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>
<div class="setting">
<label id="incentiveLabel">প্রণোদনা (%)</label>
<input id="incentive" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>
<div class="setting">
<label>Charge</label>
<input id="charge" type="text" inputmode="decimal" autocomplete="off" value="0">
</div>
<button id="clearButton" class="action clear" onclick="clearAll()">সব মুছুন</button>
</div>
</div>

<div class="panel">
<div class="result">
<span id="totalChargeLabel">Total Convert Amount with Charge</span>
<strong id="totalWithCharge">0 QAR</strong>
</div>

<label id="actualConvertedLabel">Total Converted Amount with Incentive (Actual)</label>
<div class="result-input">
<input id="actualConverted" type="text" inputmode="decimal" autocomplete="off" value="0">
<select id="actualConvertedCurrency"></select>
</div>

<label id="manualConvertedLabel">Total Manual Amount with Incentive</label>
<div class="result-input">
<input id="manualConverted" type="text" inputmode="decimal" autocomplete="off" value="0">
<select id="manualConvertedCurrency"></select>
</div>

<div class="result">
<span id="actualIncentiveLabel">Incentive Amount (Actual Rate)</span>
<strong id="actualIncentiveAmount">0 BDT</strong>
</div>
<div class="result">
<span id="manualIncentiveLabel">Incentive Amount (Manual Rate)</span>
<strong id="manualIncentiveAmount">0 BDT</strong>
</div>
<div class="result">
<span id="chargeResultLabel">Charge</span>
<strong id="chargeResult">0 QAR</strong>
</div>
<div class="result">
<span id="totalBenefitLabel">Total Benefit</span>
<strong id="totalBenefit">0 BDT</strong>
</div>
<div class="small" id="note">
Actual Rate ও Manual Rate-এর হিসাব আলাদা। Total Benefit = Manual Amount with Incentive − Actual Amount with Incentive।
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const currencies=['BDT','QAR','USD','SAR','AED','INR','GBP','EUR','KWD','OMR','BHD','PKR'];

['fromCurrency','toCurrency','actualConvertedCurrency','manualConvertedCurrency'].forEach(id=>{
 currencies.forEach(c=>$(id).add(new Option(c,c)));
});
$('fromCurrency').value='QAR';
$('toCurrency').value='BDT';
$('actualConvertedCurrency').value='BDT';
$('manualConvertedCurrency').value='BDT';

const T={
bn:{
calc:'ক্যালকুলেটর',remit:'রেমিট্যান্স ক্যালকুলেটর',
mode:'হিসাবের নিয়ম',expression:'আপনার হিসাব লিখুন',
from:'From Currency & Amount',to:'To Currency & Amount',
actual:'Actual Currency Rate',manual:'Manual Rate',
incentive:'প্রণোদনা (%)',clear:'সব মুছুন',
totalCharge:'Total Convert Amount with Charge',
actualConverted:'Total Converted Amount with Incentive (Actual)',
manualConverted:'Total Manual Amount with Incentive',
actualInc:'Incentive Amount (Actual Rate)',
manualInc:'Incentive Amount (Manual Rate)',
charge:'Charge',totalBenefit:'Total Benefit',
note:'Actual Rate ও Manual Rate-এর হিসাব আলাদা। Total Benefit = Manual Amount with Incentive − Actual Amount with Incentive।'
},
en:{
calc:'Calculator',remit:'Remittance Calculator',
mode:'Calculation Mode',expression:'Enter your calculation',
from:'From Currency & Amount',to:'To Currency & Amount',
actual:'Actual Currency Rate',manual:'Manual Rate',
incentive:'Incentive (%)',clear:'Clear All',
totalCharge:'Total Convert Amount with Charge',
actualConverted:'Total Converted Amount with Incentive (Actual)',
manualConverted:'Total Manual Amount with Incentive',
actualInc:'Incentive Amount (Actual Rate)',
manualInc:'Incentive Amount (Manual Rate)',
charge:'Charge',totalBenefit:'Total Benefit',
note:'Actual Rate and Manual Rate calculations are separate. Total Benefit = Manual Amount with Incentive − Actual Amount with Incentive.'
}
};
let language='bn';

function setLanguage(v){
 language=v;
 const t=T[v];
 $('heading').textContent=$('calcPanel').classList.contains('hidden')?t.remit:t.calc;
 $('modeLabel').textContent=t.mode;
 $('expressionLabel').textContent=t.expression;
 $('fromLabel').textContent=t.from;
 $('toLabel').textContent=t.to;
 $('actualLabel').textContent=t.actual;
 $('manualLabel').textContent=t.manual;
 $('incentiveLabel').textContent=t.incentive;
 $('clearButton').textContent=t.clear;
 $('totalChargeLabel').textContent=t.totalCharge;
 $('actualConvertedLabel').textContent=t.actualConverted;
 $('manualConvertedLabel').textContent=t.manualConverted;
 $('actualIncentiveLabel').textContent=t.actualInc;
 $('manualIncentiveLabel').textContent=t.manualInc;
 $('chargeResultLabel').textContent=t.charge;
 $('totalBenefitLabel').textContent=t.totalBenefit;
 $('note').textContent=t.note;
}
function showTab(tab){
 const calc=tab==='calc';
 $('calcPanel').classList.toggle('hidden',!calc);
 $('remitPanel').classList.toggle('hidden',calc);
 $('calcTab').classList.toggle('active',calc);
 $('remitTab').classList.toggle('active',!calc);
 $('heading').textContent=calc?T[language].calc:T[language].remit;
}

/* Remittance */
function n(id){
 let v=$(id).value.replace(/,/g,'').trim();
 if(!v||v==='-'||v==='.')return 0;
 let x=Number(v);
 return Number.isFinite(x)?x:0;
}
function fmt(x){
 if(!Number.isFinite(x))return '0';
 return x.toLocaleString('en-US',{maximumFractionDigits:4,useGrouping:true});
}
function setValue(id,x){
 if(document.activeElement!==$(id))$(id).value=fmt(x);
}
function updateRemit(source='settings'){
 const from=n('fromAmount');
 const actualRate=n('actualRate');
 const manualRate=n('manualRate');
 const incentive=n('incentive');
 const charge=n('charge');
 const factor=1+incentive/100;
 const actualBase=from*actualRate;
 const manualBase=from*manualRate;
 const actualTotal=actualBase*factor;
 const manualTotal=manualBase*factor;

 if(source==='from'){
  setValue('toAmount',actualBase);
  setValue('actualConverted',actualTotal);
  setValue('manualConverted',manualTotal);
 }else if(source==='to'){
  const to=n('toAmount');
  const newFrom=actualRate>0?to/actualRate:0;
  setValue('fromAmount',newFrom);
  setValue('actualConverted',newFrom*actualRate*factor);
  setValue('manualConverted',newFrom*manualRate*factor);
 }else if(source==='actualConverted'){
  const target=n('actualConverted');
  const divisor=actualRate*factor;
  if(divisor>0){
   const newFrom=target/divisor;
   setValue('fromAmount',newFrom);
   setValue('toAmount',newFrom*actualRate);
   setValue('manualConverted',newFrom*manualRate*factor);
  }
 }else if(source==='manualConverted'){
  // Manual result remains independent.
 }else{
  setValue('toAmount',from*actualRate);
  setValue('actualConverted',actualTotal);
  setValue('manualConverted',manualTotal);
 }

 $('actualConvertedCurrency').value=$('toCurrency').value;
 $('manualConvertedCurrency').value=$('toCurrency').value;

 $('totalWithCharge').textContent=fmt(from+charge)+' '+$('fromCurrency').value;
 $('actualIncentiveAmount').textContent=fmt(actualBase*incentive/100)+' '+$('toCurrency').value;
 $('manualIncentiveAmount').textContent=fmt(manualBase*incentive/100)+' '+$('toCurrency').value;
 $('chargeResult').textContent=fmt(charge)+' '+$('fromCurrency').value;
 $('totalBenefit').textContent=fmt(n('manualConverted')-n('actualConverted'))+' '+$('toCurrency').value;
}
$('fromAmount').addEventListener('input',()=>updateRemit('from'));
$('toAmount').addEventListener('input',()=>updateRemit('to'));
$('actualConverted').addEventListener('input',()=>updateRemit('actualConverted'));
$('manualConverted').addEventListener('input',()=>updateRemit('manualConverted'));
['actualRate','manualRate','incentive','charge'].forEach(id=>{
 $(id).addEventListener('input',()=>updateRemit('settings'));
});
$('fromCurrency').addEventListener('change',()=>updateRemit('settings'));
$('toCurrency').addEventListener('change',()=>updateRemit('settings'));

[
'fromAmount','toAmount','actualRate','manualRate','incentive','charge',
'actualConverted','manualConverted'
].forEach(id=>{
 $(id).addEventListener('focus',()=>{
  if($(id).value==='0')$(id).value='';
 });
 $(id).addEventListener('blur',()=>{
  if($(id).value.trim()==='')$(id).value='0';
  updateRemit('settings');
 });
});
function clearAll(){
 [
'fromAmount','toAmount','actualRate','manualRate','incentive','charge',
'actualConverted','manualConverted'
 ].forEach(id=>$(id).value='0');
 $('fromCurrency').value='QAR';
 $('toCurrency').value='BDT';
 updateRemit('settings');
}

/* Calculator */
const display=$('calcDisplay');
function getDisplayText(){return display.innerText.replace(/\u00a0/g,' ').trim();}
function setDisplayText(value){display.textContent=value;}
function placeCursorAtEnd(){
 const range=document.createRange();
 const selection=window.getSelection();
 range.selectNodeContents(display);
 range.collapse(false);
 selection.removeAllRanges();
 selection.addRange(range);
}
function calcAdd(value){
 let text=getDisplayText();
 if(text==='Error')text='';
 if(text==='0'&&/^\d+$/.test(value))text='';
 const selection=window.getSelection();
 let start=text.length,end=text.length;
 if(selection.rangeCount&&display.contains(selection.anchorNode)){
  const range=selection.getRangeAt(0);
  const pre=range.cloneRange();
  pre.selectNodeContents(display);
  pre.setEnd(range.startContainer,range.startOffset);
  start=pre.toString().length;
  const preEnd=range.cloneRange();
  preEnd.selectNodeContents(display);
  preEnd.setEnd(range.endContainer,range.endOffset);
  end=preEnd.toString().length;
 }
 setDisplayText(text.slice(0,start)+value+text.slice(end));
 display.focus({preventScroll:true});
 placeCursorAtEnd();
 updateLive();
}
function calcClear(){
 setDisplayText('0');
 display.focus({preventScroll:true});
 placeCursorAtEnd();
 updateLive();
}
function calcDelete(){
 const text=getDisplayText();
 if(text==='Error'||text==='0'){setDisplayText('0');}
 else{setDisplayText(text.slice(0,-1)||'0');}
 display.focus({preventScroll:true});
 placeCursorAtEnd();
 updateLive();
}

/* Calculator evaluation */
function evaluateExpression(input){
 let exp=input.replace(/,/g,'').replace(/\s/g,'');
 if(!exp||exp==='0')return null;
 if(!/^[0-9+\-*/().%]+$/.test(exp))return null;
 exp=exp.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');

 if($('calcMode').value==='regular'){
  // Avoid evaluating incomplete expressions
  if(/[+\-*/.(]$/.test(exp))return null;
  let result=Function('"use strict";return ('+exp+')')();
  return Number.isFinite(result)?result:null;
 }

 const tokens=exp.match(/\d+(?:\.\d+)?|[()+\-*/]/g);
 if(!tokens||tokens.join('')!==exp)return null;
 let i=0;
 function atom(){
  let t=tokens[i++];
  if(t==='('){
   let v=expr();
   if(tokens[i++]!==')')throw Error('Invalid');
   return v;
  }
  if(t==='-')return -atom();
  if(t==='+')return atom();
  if(!t||isNaN(Number(t)))throw Error('Invalid');
  return Number(t);
 }
 function expr(){
  let v=atom();
  while(i<tokens.length&&tokens[i]!==')'){
   let op=tokens[i++],b=atom();
   if(op==='+')v+=b;
   else if(op==='-')v-=b;
   else if(op==='*')v*=b;
   else if(op==='/')v/=b;
   else throw Error('Invalid');
  }
  return v;
 }
 let result=expr();
 if(i!==tokens.length||!Number.isFinite(result))return null;
 return result;
}
function formatCalcResult(x){
 return Number(x.toFixed(8)).toLocaleString('en-US',{maximumFractionDigits:8});
}
function updateLive(){
 const text=getDisplayText();
 try{
  const result=evaluateExpression(text);
  $('liveResult').textContent=result===null?'':formatCalcResult(result);
 }catch(e){
  $('liveResult').textContent='';
 }
}
function calculate(){
 try{
  const result=evaluateExpression(getDisplayText());
  if(result===null)return;
  setDisplayText(Number(result.toFixed(8)).toString());
  display.focus({preventScroll:true});
  placeCursorAtEnd();
  updateLive();
 }catch(e){
  $('liveResult').textContent='Error';
 }
}
display.addEventListener('input',updateLive);
$('calcMode').addEventListener('change',updateLive);

setLanguage('bn');
updateRemit('settings');
updateLive();
</script>
</body>
</html>
